name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build C# Daemon Project
        run: dotnet build src/AetherControl.Daemon/AetherControl.Daemon.csproj -c Release

      - name: Run Automated Test Suite
        shell: powershell
        run: |
          & ".\tests\Invoke-AetherTestSuite.ps1" -CiMode
