name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Automated Test Suite & Code Validation
        shell: powershell
        run: |
          & ".\tests\Invoke-AetherTestSuite.ps1" -CiMode
