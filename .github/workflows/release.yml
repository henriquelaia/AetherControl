name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Self-Contained Windows x64 Binary
        run: |
          dotnet publish src/AetherControl.Daemon/AetherControl.Daemon.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/AetherControl

      - name: Package Release Archive
        run: |
          Copy-Item -Path "Launch-AetherControl.bat","Install-AetherControl.ps1","AetherControl-NativeDaemon.ps1","README.md","LICENSE" -Destination "publish/AetherControl" -Force
          Compress-Archive -Path "publish/AetherControl/*" -DestinationPath "AetherControl-win-x64.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherControl-win-x64
          path: AetherControl-win-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AetherControl-win-x64.zip
          generate_release_notes: true
