name: Build & Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Portable Windows Release
        shell: powershell
        run: |
          $pkgDir = "release_pkg/AetherControl"
          New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null
          
          # Copy core launcher scripts and assets
          Copy-Item -Path "Launch-AetherControl.bat", "Criar-Atalho-Ambiente-Trabalho.bat", "Create-Desktop-Shortcut.bat", "Install-AetherControl.ps1", "AetherControl-NativeDaemon.ps1", "Stop-AetherControl.bat", "GUIA_RAPIDO.md", "README.md", "LICENSE" -Destination $pkgDir -Force
          Copy-Item -Path "assets" -Destination $pkgDir -Recurse -Force
          Copy-Item -Path "docs" -Destination $pkgDir -Recurse -Force
          Copy-Item -Path "src" -Destination $pkgDir -Recurse -Force

          Compress-Archive -Path "$pkgDir/*" -DestinationPath "AetherControl-win-x64.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherControl-win-x64
          path: AetherControl-win-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AetherControl-win-x64.zip
          generate_release_notes: true
